<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StemLab</title>
<link rel="icon" href="logo.png">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1117; --panel:#111b25; --panel2:#17242f; --line:#233545; --ink:#e9eff3; --mute:#8399aa;
  --err:#ff9d9d;
  --font:"Bahnschrift","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
main{max-width:940px;margin:0 auto;padding:26px 22px 80px}

/* intestazione */
header{display:flex;align-items:center;gap:12px;margin-bottom:26px}
header img{width:42px;height:42px;flex:none}
h1{font-size:25px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1}
header p{margin:0 0 0 auto;color:var(--mute);font-size:14px}

/* pulsanti */
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--mute);background:var(--panel)}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.main:hover{background:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
button:focus-visible,#drop:focus-visible,.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}

/* schermata iniziale */
#drop{position:relative;overflow:hidden;background:var(--panel);border-radius:22px;outline:1.5px dashed var(--line);outline-offset:-10px;
  text-align:center;padding:44px 24px 50px;cursor:pointer;transition:outline-color .2s,background .2s}
#drop:hover,#drop.over{background:var(--panel2);outline-color:var(--mute)}
#drop.over{outline-style:solid;outline-color:var(--ink)}
#hero{display:block;width:100%;max-width:720px;height:auto;margin:0 auto 6px}
.layer{transform:translateY(130px);mix-blend-mode:screen;opacity:.92;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#drop:hover .l0,#drop.over .l0,#drop:focus-visible .l0{transform:translateY(46px)}
#drop:hover .l1,#drop.over .l1,#drop:focus-visible .l1{transform:translateY(102px)}
#drop:hover .l2,#drop.over .l2,#drop:focus-visible .l2{transform:translateY(158px)}
#drop:hover .l3,#drop.over .l3,#drop:focus-visible .l3{transform:translateY(214px)}
#drop h2{font-size:26px;font-weight:700;margin:6px 0 6px;letter-spacing:-.01em}
#drop p{margin:0;color:var(--mute)}

/* barra del brano */
#work{display:none}
.track{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tinfo{min-width:0;flex:1 1 220px}
#name{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#dur{color:var(--mute);font-size:14px;min-height:20px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:3px;gap:2px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 15px;border-radius:999px;color:var(--mute);cursor:pointer;font-size:14px;transition:color .15s}
.seg span:hover{color:var(--ink)}
.seg input:disabled+span{opacity:.4;cursor:not-allowed}
.seg input:checked+span{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* dispositivo di calcolo */
.devbar{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin:-6px 0 20px;color:var(--mute);font-size:14px}
#devinfo{flex:1 1 320px;min-width:0}

/* gruppi */
.group{margin-top:26px}
.group>h3,.group>summary{font-size:14px;font-weight:600;color:var(--mute);margin:0 0 10px;display:flex;align-items:center;gap:10px;list-style:none;cursor:default}
.group>summary{cursor:pointer;width:max-content;border-radius:6px}
.group>summary::-webkit-details-marker{display:none}
.group>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;margin:0 3px 0 2px}
.group[open]>summary::before{transform:rotate(45deg)}
.group>summary small{font-size:13px;font-weight:400}

/* canale */
.strip{--c:#9db2c2;display:grid;grid-template-columns:5px 160px minmax(0,1fr) 190px;align-items:center;column-gap:18px;
  background:var(--panel);border-radius:12px;margin-bottom:7px;min-height:66px;overflow:hidden;transition:background .2s}
.strip.playing{background:var(--panel2)}
.band{align-self:stretch;background:var(--c)}
.meta{min-width:0;padding:10px 0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-height:19px}
.strip.orig{min-height:92px}
.strip.orig .wave{height:64px}
.wave{position:relative;height:46px}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;opacity:0}
.strip.drawn .wave canvas{opacity:1}
.act{display:flex;gap:8px;align-items:center;padding:10px 14px 10px 0;justify-content:flex-end}

/* stati della forma d'onda */
.wave::before,.wave::after{content:"";position:absolute;left:0;right:0;pointer-events:none}
.strip[data-st=idle] .wave::before,.strip[data-st=queued] .wave::before{top:50%;border-top:2px dotted var(--line)}
.strip[data-st=running] .wave::before,.strip[data-st=running] .wave::after{top:18%;bottom:18%;
  background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 8px);border-radius:2px}
.strip[data-st=running] .wave::before{opacity:.2}
.strip[data-st=running] .wave::after{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,transparent 28%);mask-image:linear-gradient(90deg,transparent,#000 14%,transparent 28%);
  -webkit-mask-size:350% 100%;mask-size:350% 100%;animation:sweep 1.5s linear infinite}
@keyframes sweep{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
/* avanzamento: la forma d'onda si riempie fino alla percentuale, con il numero sopra */
.strip.det[data-st=running] .wave::after{animation:none;-webkit-mask-image:none;mask-image:none;opacity:1;
  clip-path:inset(0 calc(100% - var(--p, 0) * 100%) 0 0);transition:clip-path .9s ease}
.pct{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.pct span{background:var(--panel);color:var(--c);font-weight:700;font-size:15px;line-height:1;padding:5px 12px;border-radius:999px;
  font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line)}
.strip.det[data-st=running] .pct{display:flex}
.strip[data-st=error] .wave::after{content:attr(data-msg);color:var(--err);font-size:13px;top:0;bottom:0;display:flex;align-items:center;overflow:hidden;line-height:1.3}

/* pulsante play */
.pbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--c);color:#0a1117;display:grid;place-items:center;padding:0;transition:transform .15s,filter .15s}
.pbtn:hover{filter:brightness(1.12);transform:scale(1.05)}
.pbtn svg{width:19px;height:19px;fill:currentColor}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;display:none;max-width:90vw;font-size:14px}

@media (max-width:680px){
  .strip{grid-template-columns:5px 1fr auto;row-gap:0}
  .meta{padding:12px 0 2px}
  .wave{grid-column:2 / 4;order:5;margin:0 14px 12px 0}
  .act{padding:10px 14px 0 0}
  header p{display:none}
}
@media (prefers-reduced-motion:reduce){
  .layer,.btn,.pbtn,.strip{transition:none}
  .strip[data-st=running] .wave::after{animation:none;-webkit-mask-image:none;mask-image:none;opacity:.5}
  .strip.det[data-st=running] .wave::after{opacity:1;transition:none}
}
</style></head><body><main>

<header>
  <img src="logo.png" alt="" width="42" height="42">
  <h1>StemLab</h1>
  <p>Separazione degli stem sul tuo computer</p>
</header>

<div id="drop" tabindex="0" role="button" aria-label="Scegli un brano da separare">
  <svg id="hero" viewBox="0 0 720 260" aria-hidden="true"></svg>
  <h2>Trascina qui un brano</h2>
  <p>oppure clicca per scegliere un file: mp3, wav, flac o m4a</p>
</div>
<input id="pick" type="file" accept="audio/*" hidden>

<section id="work">
  <div class="track">
    <div class="tinfo"><div id="name"></div><div id="dur"></div></div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="Qualità della separazione">
        <label title="Più rapida, qualità buona"><input type="radio" name="preset" value="veloce"><span>Veloce</span></label>
        <label title="Un buon compromesso"><input type="radio" name="preset" value="bilanciata" checked><span>Bilanciata</span></label>
        <label title="La migliore qualità, richiede più tempo"><input type="radio" name="preset" value="massima"><span>Massima</span></label>
      </div>
      <button id="all" class="btn main">Separa tutto</button>
      <button id="change" class="btn">Cambia brano</button>
    </div>
  </div>
  <div class="devbar">
    <span id="devinfo">Controllo la scheda video…</span>
    <div class="seg" role="radiogroup" aria-label="Dispositivo di calcolo">
      <label title="Usa la GPU NVIDIA se c'è, altrimenti la CPU"><input type="radio" name="device" value="auto" checked><span>Automatico</span></label>
      <label title="Solo la scheda video NVIDIA: la più veloce"><input type="radio" name="device" value="gpu"><span>GPU</span></label>
      <label title="Solo il processore: funziona su ogni computer, ma è molto più lento"><input type="radio" name="device" value="cpu"><span>CPU</span></label>
    </div>
  </div>
  <div id="orig"></div>
  <div id="list"></div>
</section>
<div id="toast" role="status"></div>
</main>

<script>
const $=s=>document.querySelector(s);
const COLORS={
  mix:'#9db2c2',
  vocals:'#ff6f91',lead_vocal:'#ff9bb0',backing_vocal:'#d94f78',
  instrumental:'#7aa2ff',
  drums:'#ffb454',bass:'#9b8cff',guitar:'#b4e050',piano:'#4fd1e6',other:'#5fe0b0',
  kick:'#ffa23a',snare:'#ffc46b',toms:'#e68a1f',hihat:'#ffd98f',ride:'#f2b84a',crash:'#ffe0a8'
};
const ICON={
  play:'<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>'
};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const j=(u,o)=>fetch(u,o).then(async r=>{const b=await r.json().catch(()=>({}));if(!r.ok)throw b.detail||'Errore';return b});
let job=null,cur=null,poll=null;const au=new Audio();
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const fileUrl=id=>`/files/${job.id}/${id==='mix'?'mix':id+'.wav'}`;
const getPreset=()=>document.querySelector('input[name=preset]:checked').value;
const getDevice=()=>document.querySelector('input[name=device]:checked').value;

/* scheda video: il server la controlla all'avvio, qui si aspetta il risultato */
let SYS={ready:false,gpu:false,name:''};
function renderDev(){
  const gpuRadio=document.querySelector('input[name=device][value=gpu]');
  gpuRadio.disabled=SYS.ready&&!SYS.gpu;
  if(gpuRadio.disabled&&gpuRadio.checked)document.querySelector('input[name=device][value=auto]').checked=true;
  const d=getDevice(),el=$('#devinfo');
  if(!SYS.ready){el.textContent='Controllo la scheda video…';return}
  const cpu=d==='cpu'||(d==='auto'&&!SYS.gpu);
  if(!cpu)el.textContent='Calcolo sulla GPU: '+SYS.name+'.';
  else if(SYS.gpu)el.textContent='Calcolo sulla CPU, molto più lenta della GPU '+SYS.name+'. Per i brani lunghi conviene Veloce.';
  else el.textContent='Nessuna GPU NVIDIA trovata: calcolo sulla CPU, molto più lento. Per i brani lunghi conviene Veloce.';
}
(async function pollSys(n=0){
  try{SYS=await j('/api/system')}catch(e){}
  renderDev();
  if(!SYS.ready&&n<90)setTimeout(()=>pollSys(n+1),1000);
})();
document.querySelectorAll('input[name=device]').forEach(i=>i.onchange=renderDev);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2800)}

/* illustrazione iniziale: un solo brano fatto di livelli che si separano */
(function hero(){
  const W=720,bw=6,gap=5,n=Math.floor(W/(bw+gap));
  const layers=[['#ff6f91',1,.3],['#ffb454',.82,1.7],['#9b8cff',.92,2.9],['#5fe0b0',.7,4.1]];
  let s='';
  layers.forEach(([c,amp,ph],li)=>{
    s+=`<g class="layer l${li}" fill="${c}">`;
    for(let i=0;i<n;i++){
      const t=i/n;
      let e=Math.abs(Math.sin(t*9+ph)*.55+Math.sin(t*23+ph*2)*.3+Math.sin(t*51+ph*3)*.15);
      e*=.3+.7*Math.sin(Math.PI*t);
      const h=Math.max(5,e*amp*74);
      s+=`<rect x="${i*(bw+gap)}" y="${(-h/2).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3"/>`;
    }
    s+='</g>';
  });
  $('#hero').innerHTML=s;
})();

/* caricamento file */
const drop=$('#drop'),dropTitle=drop.querySelector('h2'),dropSub=drop.querySelector('p'),SUB=dropSub.textContent;
drop.onclick=choose;
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};
$('#pick').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
['dragover','dragenter'].forEach(t=>addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)load(f)});

/* invio del file come corpo grezzo (FormData non funziona nella finestra dell'app).
   Se fetch fallisce per un motivo diverso da una risposta HTTP, si riprova con XHR. */
function sendFile(file){
  const url='/api/upload?name='+encodeURIComponent(file.name);
  const httpErr=(st,t)=>{let d=t;try{d=JSON.parse(t).detail}catch(_){}
    const e=new Error('HTTP '+st+(d?': '+(typeof d==='string'?d:JSON.stringify(d)).slice(0,140):''));e.http=true;return e};
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file})
    .then(async r=>{const t=await r.text();if(!r.ok)throw httpErr(r.status,t);return JSON.parse(t)})
    .catch(err=>{
      if(err.http)throw err;
      return new Promise((ok,ko)=>{
        const x=new XMLHttpRequest();x.open('POST',url);x.responseType='text';
        x.upload.onprogress=e=>{if(e.lengthComputable)dropTitle.textContent='Caricamento '+Math.round(100*e.loaded/e.total)+'%'};
        x.onload=()=>{if(x.status>=300)return ko(httpErr(x.status,x.responseText));try{ok(JSON.parse(x.responseText))}catch(_){ko(err)}};
        x.onerror=()=>ko(err);x.send(file);
      });
    });
}
function showLoadError(e){
  dropTitle.textContent='Trascina qui un brano';
  dropSub.textContent='Non riesco a caricare il file ('+(e&&e.message||e)+'). Riprova.';dropSub.style.color='var(--err)';
}
/* clic: finestra nativa di Windows se disponibile, altrimenti il selettore del browser */
async function choose(){
  if(window.pywebview&&pywebview.api&&pywebview.api.pick){
    try{
      const r=await pywebview.api.pick();
      if(r){au.pause();cur=null;clearInterval(poll);job=r;build()}
    }catch(e){showLoadError(e)}
  }else $('#pick').click();
}
async function load(file){
  au.pause();cur=null;clearInterval(poll);
  dropTitle.textContent='Caricamento in corso…';dropSub.textContent=SUB;dropSub.style.color='';
  try{job=await sendFile(file);build()}
  catch(e){showLoadError(e)}
}

function build(){
  drop.style.display='none';$('#work').style.display='block';$('#name').textContent=job.name;$('#dur').textContent='';
  setBusy(false);
  $('#orig').replaceChildren(mkRow({id:'mix',label:'Originale',group:'Strumenti',status:'ready'}));
  const list=$('#list');list.replaceChildren();
  for(const g of ['Voce','Strumenti','Batteria']){
    const box=document.createElement(g==='Batteria'?'details':'section');box.className='group';box.dataset.g=g;
    const head=document.createElement(g==='Batteria'?'summary':'h3');
    head.innerHTML=g==='Batteria'?'Dettaglio batteria <small></small>':'';
    if(g!=='Batteria')head.textContent=g;
    box.append(head);
    job.stems.filter(s=>s.group===g).forEach(s=>box.append(mkRow(s)));
    list.append(box);
  }
  sync();summary();
}

function mkRow(s){
  const r=document.createElement('div');r.className='strip'+(s.id==='mix'?' orig':'');r.dataset.id=s.id;
  r.style.setProperty('--c',COLORS[s.id]||COLORS.mix);
  r.innerHTML='<div class="band"></div><div class="meta"><div class="name"></div><div class="state"></div></div><div class="wave"><canvas></canvas><div class="pct"><span></span></div></div><div class="act"></div>';
  r.querySelector('.name').textContent=s.label;
  r.querySelector('canvas').onclick=e=>{
    if(!r._peaks)return;const b=e.currentTarget.getBoundingClientRect();
    playStem(s.id,(e.clientX-b.left)/b.width);
  };
  upd(r,s);return r;
}

const STATE_TXT={idle:'',queued:'In coda',running:'In elaborazione…',ready:'Pronto',error:'Non riuscito'};
function stateText(r){
  if(r.dataset.st==='running'){
    const p=r.dataset.p,on=r.dataset.on,ph=r.dataset.phase;
    if(ph==='download')return 'Scarico il modello'+(p!==''?' '+p+'%':'…');
    if(ph==='separate'&&p!=='')return 'Separazione '+p+'%'+(on?' su '+on:'');
    if(ph==='prepare')return 'Preparazione…';
    return on?'In elaborazione su '+on:'In elaborazione…';
  }
  if(r.dataset.id===cur&&r.dataset.st==='ready'&&au.duration)return fmt(au.currentTime)+' / '+fmt(au.duration);
  return STATE_TXT[r.dataset.st]||'';
}
function upd(r,s){
  const key=[s.status,s.error,s.on,s.phase,s.progress].join('|');if(r.dataset.k===key)return;r.dataset.k=key;r.dataset.st=s.status;r.dataset.on=s.on||'';
  const det=s.status==='running'&&s.progress!=null;
  r.dataset.phase=s.phase||'';r.dataset.p=det?String(s.progress):'';
  r.classList.toggle('det',det);
  r.querySelector('.wave').style.setProperty('--p',det?s.progress/100:0);
  r.querySelector('.pct span').textContent=det?s.progress+'%':'';
  const a=r.querySelector('.act');
  r.querySelector('.state').textContent=stateText(r);
  r.querySelector('.wave').dataset.msg=s.error||'';
  if(s.status==='idle')a.innerHTML='<button class="btn" data-a="sep">Separa</button>';
  else if(s.status==='ready')a.innerHTML=
    `<button class="pbtn" data-a="play" aria-label="Ascolta ${s.label}">${ICON.play}</button>`+
    (s.id==='mix'?'':`<button class="btn" data-a="save" aria-label="Salva ${s.label} in WAV">${ICON.save}WAV</button>`);
  else if(s.status==='error')a.innerHTML='<button class="btn" data-a="sep">Riprova</button>';
  else a.innerHTML='';
  if(s.status==='ready')attachWave(r,s.id);
  sync();
}

/* forme d'onda: si decodifica un file alla volta per non saturare la memoria */
const AC=window.AudioContext||window.webkitAudioContext;let actx=null,chain=Promise.resolve();const cache=new Map();
function getPeaks(url){
  if(cache.has(url))return cache.get(url);
  const p=chain.then(async()=>{
    const buf=await (await fetch(url)).arrayBuffer();
    actx=actx||new AC();
    const a=await actx.decodeAudioData(buf);
    const n=1200,out=new Float32Array(n);
    for(let c=0;c<a.numberOfChannels;c++){
      const d=a.getChannelData(c),step=d.length/n;
      for(let i=0;i<n;i++){
        let m=0;const s=Math.floor(i*step),e=Math.min(d.length,Math.floor((i+1)*step));
        for(let k=s;k<e;k++){const v=d[k]<0?-d[k]:d[k];if(v>m)m=v}
        if(m>out[i])out[i]=m;
      }
    }
    let mx=0;for(const v of out)if(v>mx)mx=v;mx=mx||1;
    for(let i=0;i<n;i++)out[i]=Math.pow(out[i]/mx,.8);
    return {peaks:out,duration:a.duration};
  }).catch(()=>null);
  cache.set(url,p);chain=p;return p;
}
function attachWave(r,id){
  if(r._wave===id)return;r._wave=id;
  getPeaks(fileUrl(id)).then(res=>{
    if(!res||!r.isConnected)return;
    r._peaks=res.peaks;r.classList.add('drawn');
    if(id==='mix')$('#dur').textContent='Durata '+fmt(res.duration);
    if(reduceMotion){r._rv=1;draw(r);return}
    const t0=performance.now();
    const step=t=>{r._rv=Math.min(1,(t-t0)/800);draw(r);if(r._rv<1&&r.isConnected)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function draw(r){
  const cv=r.querySelector('canvas'),pk=r._peaks;if(!pk)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const col=r.style.getPropertyValue('--c'),bw=3,gap=2,n=Math.floor(w/(bw+gap));
  const prog=(r.dataset.id===cur&&au.duration)?au.currentTime/au.duration:0,rv=r._rv==null?1:r._rv;
  g.fillStyle=col;
  for(let i=0;i<n;i++){
    if(i/n>rv)break;
    const a=Math.floor(i*pk.length/n),b=Math.max(a+1,Math.floor((i+1)*pk.length/n));
    let p=0;for(let k=a;k<b;k++)if(pk[k]>p)p=pk[k];
    const bh=Math.max(3,p*h*.94),x=i*(bw+gap),y=(h-bh)/2;
    g.globalAlpha=(i/n<prog)?1:.38;
    if(g.roundRect){g.beginPath();g.roundRect(x,y,bw,bh,1.5);g.fill()}else g.fillRect(x,y,bw,bh);
  }
  g.globalAlpha=1;
}
let rz;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>document.querySelectorAll('.strip.drawn').forEach(draw))});

/* riproduzione */
function playStem(id,frac){
  if(cur!==id){
    au.src=fileUrl(id);cur=id;
    if(frac!=null)au.addEventListener('loadedmetadata',()=>{au.currentTime=frac*au.duration},{once:true});
    document.querySelectorAll('.strip.drawn').forEach(draw);
  }else if(frac!=null&&au.duration)au.currentTime=frac*au.duration;
  au.play();sync();
}
function curRow(){return cur&&document.querySelector(`.strip[data-id="${cur}"]`)}
function tick(){
  const r=curRow();
  if(r){draw(r);r.querySelector('.state').textContent=stateText(r)}
  if(!au.paused)requestAnimationFrame(tick);
}
function sync(){
  document.querySelectorAll('.strip').forEach(r=>{
    const playing=r.dataset.id===cur&&!au.paused;
    r.classList.toggle('playing',playing);
    const b=r.querySelector('[data-a=play]');
    if(b){b.innerHTML=playing?ICON.pause:ICON.play;b.setAttribute('aria-label',(playing?'Metti in pausa ':'Ascolta ')+r.querySelector('.name').textContent)}
    r.querySelector('.state').textContent=stateText(r);
    if(r.classList.contains('drawn'))draw(r);
  });
}
au.onplay=()=>{sync();requestAnimationFrame(tick)};
au.onpause=au.onended=sync;
addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body&&cur){e.preventDefault();au.paused?au.play():au.pause()}
});

/* azioni */
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const id=b.closest('.strip').dataset.id,a=b.dataset.a;
  if(a==='sep')ask([id]);
  if(a==='play'){if(cur===id&&!au.paused){au.pause()}else playStem(id)}
  if(a==='save')save(id);
});
$('#all').onclick=()=>ask(job.stems.map(s=>s.id));
$('#change').onclick=()=>{
  au.pause();cur=null;clearInterval(poll);job=null;$('#work').style.display='none';
  drop.style.display='';dropTitle.textContent='Trascina qui un brano';dropSub.textContent=SUB;dropSub.style.color='';$('#pick').value='';
};
function setBusy(b){const el=$('#all');el.disabled=b;el.textContent=b?'Elaborazione in corso…':'Separa tutto'}
async function ask(ids){
  try{
    job=await j(`/api/jobs/${job.id}/stems`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,preset:getPreset(),device:getDevice()})});
    refresh();start();
  }catch(e){toast('Errore: '+e)}
}
function busy(){return job.stems.some(s=>s.status==='queued'||s.status==='running')}
function refresh(){
  job.stems.forEach(s=>{const r=document.querySelector(`#list .strip[data-id="${s.id}"]`);r&&upd(r,s)});
  summary();setBusy(busy());
}
function summary(){
  const g=document.querySelector('.group[data-g=Batteria] small');if(!g||!job)return;
  const st=job.stems.filter(s=>s.group==='Batteria'),ok=st.filter(s=>s.status==='ready').length;
  g.textContent=ok?`${ok} di ${st.length} pronti`:'cassa, rullante, tom, hi-hat, ride, crash';
}
function start(){
  clearInterval(poll);
  poll=setInterval(async()=>{
    try{
      job=await j('/api/jobs/'+job.id);refresh();
      if(!busy()){clearInterval(poll);toast('Elaborazione completata')}
    }catch(e){clearInterval(poll);setBusy(false)}
  },1200);
}
async function save(id){
  if(window.pywebview&&pywebview.api){
    try{const r=await pywebview.api.save(job.id,id);if(r.ok)toast('Salvato in '+r.path)}catch(e){toast('Salvataggio non riuscito')}
  }else{const a=document.createElement('a');a.href=fileUrl(id);a.download=`${job.name} - ${id}.wav`;a.click()}
}
</script></body></html>
